<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CBT Exam Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(rgba(0, 159, 229, 0.85), rgba(0, 159, 229, 0.85)),
                url("../assets/background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
	    background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
	    z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s;
            
        }

        .btn-primary {
            background: white;
            color: #009fe5;
        }

        .btn-primary:hover {
            background: #f2f2f2;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: transparent;
            color: white;
            border: none;
        }
        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 159, 229, 0.5);
        }
        .btn:disabled {
            cursor: wait;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome to EAGLE LIFE Exam Portal</h1>
        <p>Click below to begin your examination.</p>

        <button id="startBtn" class="btn btn-primary" autofocus>Proceed to Exam Login >></button>
        <button id="updateBtn" class="btn btn-secondary" type="button">Check for updates</button>
        <p id="updateStatus" role="status" aria-live="polite"></p>
    </div>

    <!-- KEEP YOUR JS CONNECTION -->
<script>
const btn = document.getElementById('startBtn');
const updateBtn = document.getElementById('updateBtn');
const updateStatus = document.getElementById('updateStatus');

btn.addEventListener('click', async() => {
    btn.innerText = "Connecting...";
    btn.disabled = true;
    
    const result = await window.electronAPI.examLogin();

        if (!result.success) {
            //login failed, reset button text and state
            btn.innerText = "Proceed to Exam Login >>";
            btn.disabled = false;
        }
   
});
updateBtn.addEventListener('click', async () => {
   updateBtn.disabled = true;
   updateBtn.innerText = "Checking for updates...";
   updateStatus.innerText = "";

   try {
       const result = await window.electronAPI.openUpdateLink();

       if (!result.success) {
           updateStatus.innerText = result.error || "Unable to check for updates.";
           return;
       }

       if (result.updateAvailable === true) {
           updateStatus.innerText = "An update is available. It will download and restart the app to install.";
       } else if (result.updateAvailable === false) {
           updateStatus.innerText = "You are up to date.";
       } else {
           updateStatus.innerText = "An update check is already in progress.";
       }
   } catch (error) {
       updateStatus.innerText = error.message || "Unable to check for updates.";
   } finally {
       updateBtn.disabled = false;
       updateBtn.innerText = "Check for updates";
   }
});
</script>

</body>
</html>
