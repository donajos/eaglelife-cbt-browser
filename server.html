<!-- server.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enter Server IP</title>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

input {
    width: 250px;
    padding: 8px;
    font-size: 14px;
}

button {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 14px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;

}




</style>
</head>

<body>

<h3>Enter Server IP</h3>

<input type="text" id="serverIp" placeholder="e.g. 172.16.0.3" />
<button id="okBtn">OK</button>

<script>


const ipInput = document.getElementById("serverIp");
// Load saved IP when page opens
    window.addEventListener("DOMContentLoaded", async () => {
        const savedIP = await window.electronAPI.getIP();
        if (savedIP) {
            ipInput.value = savedIP;
        }
    });

document.getElementById("okBtn").addEventListener("click", () => {
    const ip = ipInput.value.trim();

    if (!ip) {
        window.electronAPI.showMessage("Please enter server IP");
        return;
    }

    // Strict IPv4 validation (0-255 per octet)
    const parts = ip.split(".");
    if (
        parts.length !== 4 ||
        parts.some(part => {
            const num = Number(part);
            return isNaN(num) || num < 0 || num > 255;
        })
    ) {
        window.electronAPI.showMessage("Please enter a valid IP address");
        return;
    }

    if (ip === "0.0.0.0") {
        window.electronAPI.showMessage("Invalid IP address");
        return;
    }
    // Send to main process
    window.electronAPI.saveIP(ip);
    //window.electronAPI.submitServerIP();
    
});

</script>

</body>
</html>
