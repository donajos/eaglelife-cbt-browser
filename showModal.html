.modal-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fefefe; /* same as default alert */
    border: 1px solid #888;
    border-radius: 8px;
    width: 100%;
    padding: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    text-align: center;
    font-family: sans-serif;
}



#globalModalOk {
  padding: 8px 20px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

#globalModalOk:hover {
  background: #0056b3;
}

<!-- Modal for messages -->

    </div>
