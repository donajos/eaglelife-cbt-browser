<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CBT Start</title>

<style>
/* Root container */
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
}

/* Background image layer */
.bg-image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("assets/background.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    
    z-index: 1;
}

/* Green overlay layer */
.bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 159, 229, 0.85); /* sky blue tint */
    z-index: 2;
}

/* Content layer */
.content {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Start button */
.btn {
    
    padding: 15px 50px;
    border: none;
    border-radius: 6px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
    transition: 0.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    
    
}

.btn:hover {
    background: #f2f2f2;
    transform: scale(1.05);
}

.btn:active {
    transform: scale(0.97);
}

.btn-primary{
	background: white;
        color: #009fe5;
}

.btn-primary:hover {
    background: #f2f2f2;
}
</style>
</head>

<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="content">
    <button class="btn btn-primary" onclick="start()">START</button>
</div>
<footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; z-index: 4; font-size: 18px; color: white;" id="foot">
    
</footer>

<script>
function start() {
    if (window.electronAPI) {
        window.electronAPI.startPage();
    }
}
function versionCheck() {
    window.electronAPI.getVersion().then(version => {
        const foot = document.getElementById('foot');
        foot.innerHTML = `Eagle-Life CBT examination Client v${version} © 2026. All rights reserved.<br>Developed by Oluwaseyi.`;
    });
}
versionCheck();
</script>

</body>
</html>
